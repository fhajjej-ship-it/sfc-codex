name: Pull request checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pull-request-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    name: Tests and plugin validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.10'
      - name: Validate the plugin
        run: python3 scripts/validate_plugin.py
      - name: Run the test suite
        run: python3 tests/run_suite.py
  session:
    name: macOS session tests
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - name: Verify native session support
        env:
          PYTHONPATH: scripts
        run: |
          python3 - <<'PY'
          from sfc_lib.lifeline import supported
          if not supported():
              raise SystemExit('This runner cannot exercise the macOS session or process cleanup tests.')
          PY
      - name: Run session runtime tests
        run: python3 -m unittest discover -s tests -p 'test_session_runtime.py' -v
